<!-- Recreating the HTML Structure of the cat photo website-->
<!DOCTYPE html>
<html lang ='en'>
    <head>
        <title>Cat-Photo-App</title>
        <meta charset ="utf-8">
    </head>
    <body>
        <h1>Cat Photo App</h1>
        <div>
            <p>Everyone loves <a href="">cute cats</a> online!</p>
            <p>See more <a href="">cat photos</a> in our gallery.</p>
            <img src="https://bit.ly/fcc-relaxing-cat" att="A cat">
        </div>
        <div>
            <h2>Cat Lists</h2>
            <h3>Things cats love:</h3>
            <ul>
                <li>cat nip</li>
                <li>laser pointers</li>
                <li>lasagna</li>
            </ul>
            <figure>
                <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/lasagna.jpg" alt="Lasagna">
                <figcaption>Cats <em>love</em> lasagna</figcaption>
            </figure>
        </div>
        <div>
            <h2>Top three things cat hate:</h2>
            <ol>
                <li>Flea treatment</li>
                <li>Thunder</li>
                <li>Other cats</li>
            </ol>
            <figure>
                <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg">
                <figcaption>Cats <strong>hate</strong> other cats</figcaption>
            </figure>
        </div>
        <footer>
            No Copyright - Norma's site
        </footer>
    </body>

</html>
